# Windows 出包流水线（self-hosted runner）
#
# 前置（人工，一次性）：
#   1. GitHub 仓库 Settings → Actions → Runners → New self-hosted runner → Windows x64，
#      按页面向导下载并 config.cmd 注册（token 由页面生成），最后用 run.cmd 以交互方式启动。
#      不要装成 Windows 服务：Unity Personal license 绑定当前登录用户，服务账号（SYSTEM）下
#      Unity 找不到授权会激活失败。
#   2. 出包期间不要开着本项目的 Unity 编辑器（同项目只能有一个 Unity 实例）。
#
# 触发：push 到 Dev_Pao，或 Actions 页手动 Run workflow。
# 产物：GitHub Release（tag = build-<时间戳>，附件 TapTap26-Win64-<时间戳>.zip），Release 页下载解压即玩；
#       本地不留包：zip 与 Build 目录在 Release 成功后即删（Release 失败则本地保留兜底）。
# 权限：发 Release 需 GITHUB_TOKEN 写权限（见 job 级 permissions）。
#
# 注意：checkout 设 clean:false 保留 Library 缓存，首次构建最慢，之后为增量。
# 维护：某轮被取消/强杀后（runner 上 Unity 进程被结束），增量缓存可能截断，下一轮报
# Burst "failed running" / EndOfStreamException——删 runner 工作区下的 Library 重跑即可。
# Unity 版本升级（ProjectVersion.txt 变更）时，改下方 UNITY_EXE 路径里的版本号。

name: build-windows

on:
  push:
    branches: [Dev_Pao]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false # 保留 Library/ 增量构建缓存；勿改回 true，否则每轮全量重建

      - name: Sync local assets
        shell: powershell
        run: |
          # 资产不入库（.gitignore 排除 Arts 与 Wwise bank），构建前从本机项目目录镜像进
          # runner 工作区；.meta 随资产一起复制（GUID 对齐，场景/预制体引用才认）。
          # 路径绑定本机（self-hosted runner = 本机），换机器需改。
          $srcRoot = 'D:\Github hierarchy\TapCom26\My project (1)\Assets'
          $pairs = @(
            @('Arts', 'Arts'),
            @('StreamingAssets\Audio\GeneratedSoundBanks', 'StreamingAssets\Audio\GeneratedSoundBanks')
          )
          foreach ($p in $pairs) {
            $src = Join-Path $srcRoot $p[0]
            if (-not (Test-Path $src)) { Write-Host "ERROR: 本地资产源不存在: $src"; exit 1 }
            robocopy $src (Join-Path 'Assets' $p[1]) /MIR /NJH /NJS /NDL /NFL /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { Write-Host "ERROR: robocopy $($p[0]) 失败 code=$LASTEXITCODE"; exit 1 }
            Write-Host "synced: $($p[0])"
          }
          exit 0

      - name: Build (Unity batchmode)
        id: build
        shell: powershell
        env:
          UNITY_EXE: 'C:\Program Files\Unity\Hub\Editor\6000.0.53f1\Editor\Unity.exe'
        run: |
          $project = $env:GITHUB_WORKSPACE
          $logDir = Join-Path $project 'Logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $log = Join-Path $logDir 'ci-build.log'
          $ts = Get-Date -Format 'yyyyMMdd-HHmm'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "timestamp=$ts" -Encoding ASCII
          $unityArgs = @(
            '-batchmode', '-nographics',
            "-projectPath", "`"$project`"",
            '-buildTarget', 'StandaloneWindows64',
            '-executeMethod', 'TapCom.EditorTools.CiBuild.BuildWindows64',
            '-buildTimestamp', $ts,
            "-logFile", "`"$log`""
          )
          # PowerShell 不等 GUI 程序：必须 Start-Process -Wait 才能拿到真实退出码
          $p = Start-Process -FilePath $env:UNITY_EXE -ArgumentList $unityArgs -Wait -PassThru
          $code = $p.ExitCode
          Write-Host "Unity exit code: $code"
          if (-not (Test-Path $log)) {
            Write-Host "ERROR: Unity 没有写日志文件（进程未真正运行）"
            exit 1
          }
          Get-Content $log -Tail 80
          # 判成败以日志 SUCCESS 标记为准（被测系统自证）：Unity 在 EditorApplication.Exit 的
          # 域卸载阶段偶发崩溃（退出码 1073741845），但那时产物已完整落盘；退出码只当失败信号用。
          if (Select-String -Path $log -Pattern '\[CiBuild\] SUCCESS' -Quiet) { exit 0 }
          if ($code -eq 0) {
            Write-Host "ERROR: 退出码 0 但日志无 [CiBuild] SUCCESS（假绿防护）"
            exit 1
          }
          exit $code

      - name: Zip build
        if: success()
        shell: powershell
        run: |
          $ts = '${{ steps.build.outputs.timestamp }}'
          $zip = "Build\TapTap26-Win64-$ts.zip"
          Compress-Archive -Path "Build\StandaloneWindows64\*" -DestinationPath $zip -Force
          # 自证：zip 在且体积合理（当前包 ~104MB；阈值 10MB 防空包）
          $item = Get-Item $zip
          if ($item.Length -lt 10MB) { Write-Host "ERROR: zip 过小，疑似空包"; exit 1 }
          Write-Host "zip 完成: $zip $([math]::Round($item.Length/1MB)) MB"

      - name: Upload release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.build.outputs.timestamp }}
          name: TapTap26-Win64-${{ steps.build.outputs.timestamp }}
          files: Build/TapTap26-Win64-*.zip
          body: Windows 独立包。解压后双击 exe；git checkout 无美术资源与 Wwise bank，画面缺图且无声。

      - name: Clean local build
        if: success()
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "Build\StandaloneWindows64" -ErrorAction SilentlyContinue
          Remove-Item -Force "Build\TapTap26-Win64-*.zip" -ErrorAction SilentlyContinue
          Write-Host "本地构建产物已清（包在 Release 页）"
